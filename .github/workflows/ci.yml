name: CI

# Fast feedback on every push/PR: types + unit tests. (Full data-integrity + packaging + smoke
# gates live in release.yml and run before any release is published.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mobile
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate edition files and report coverage changes
        run: |
          node --experimental-sqlite --import tsx data-pipeline/editionPacks.ts validate
          node build/edition-pin-report.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

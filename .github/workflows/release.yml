name: Build installers

# How to cut a release:
#   1. Bump "version" in package.json (e.g. 0.1.0 -> 0.2.0)
#   2. Commit and push to main
# Gates before anything is published: typecheck + unit tests, the data-pipeline assertions,
# a DB-integrity test, and a smoke test of the packaged app on each OS. If any fail, no release.
# Unrelated package.json edits don't re-release. A manual run builds for testing without releasing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  # Is package.json's version new (no release yet)?
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION already released — no new release."
            exit 0
          fi
          echo "is_new=true" >> "$GITHUB_OUTPUT"
          echo "::notice::v$VERSION is new — building + releasing."
          # A real release (a version bump pushed to main) MUST ship a human-readable changelog
          # entry — its contents become the Release notes. See docs/RELEASING.md.
          if [ "${{ github.event_name }}" = "push" ] && ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md entry for v$VERSION. Add a '## [$VERSION] - YYYY-MM-DD' section (see docs/RELEASING.md) before pushing the version bump."
            exit 1
          fi

  # Fast correctness gate: types + unit tests. Blocks the build if it fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: [check, test]
    if: needs.check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon (macOS CI bills 10×; Intel/macos-13 dropped to stay cheap)
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the Bible database (pipeline assertions gate the data)
        run: npm run db:build
      - name: DB integrity test
        run: npx vitest run test/db.test.ts
      - name: Package the app
        run: npx electron-vite build && npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test the packaged app (boots, opens DB, loads native deps)
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            macOS)   "dist/mac-arm64/Open Bible Study.app/Contents/MacOS/Open Bible Study" --smoke-test ;;
            Windows) "dist/win-unpacked/Open Bible Study.exe" --smoke-test ;;
            Linux)   sudo apt-get update && sudo apt-get install -y xvfb
                     xvfb-run -a "dist/linux-unpacked/open-bible-study" --smoke-test --no-sandbox ;;
          esac
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  # Publish the Release only after every platform built + passed its smoke test.
  release:
    needs: [check, build]
    if: needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          # Extract this version's section (the lines between "## [VERSION]" and the next "## [").
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { f=1; next }
            /^## \[/ { f=0 }
            f { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          cat >> RELEASE_BODY.md <<'EOF'

          ### Download
          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | `*-mac-arm64.dmg` |
          | Windows | `*-setup.exe` |
          | Linux | `*.AppImage` or `*.deb` |

          First launch shows a one-time "unidentified developer" prompt (the app isn't code-signed) — see the [install guide](https://github.com/mando222/bibleStudy/blob/main/docs/INSTALL.md) for the one-click fix per OS. Your notes and settings carry over across updates.
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true # GitHub's auto "What's Changed" is appended below the changelog
          append_body: true
          body_path: RELEASE_BODY.md
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.AppImage
            installers/**/*.deb

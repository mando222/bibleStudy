name: Build installers

# Build macOS (Apple Silicon + Intel), Windows, and Linux installers on native runners —
# each builds the correct platform binaries for node-llama-cpp + sqlite-vec.
# Run manually from the Actions tab, or push a v* tag to also create a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Needed so the release step can create the GitHub Release and upload installers.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon (macOS CI bills 10×; Intel/macos-13 dropped to stay cheap)
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Bible database
        run: npm run db:build

      - name: Package the app
        run: npx electron-vite build && npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  # One job publishes the Release (only on v* tags), so the three build jobs never race.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installers/**/*.dmg
            installers/**/*.exe
            installers/**/*.AppImage
            installers/**/*.deb
